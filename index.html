<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentoria AI - Questions de Cours</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Barre de navigation -->
    <header class="navbar">
        <h2>Mentoria AI</h2>
        <nav class="nav-links">
            <a href="index.html" class="active">Questions de Cours</a>
            <a href="redaction.html">Rédaction & Mémoire</a>
        </nav>
        <button id="pdfBtn" class="pdf-btn">Télécharger en PDF</button>
    </header>

    <!-- Conteneur principal de discussion -->
    <main class="main-container">
        <div id="chatBox" class="chat-box">
            <div class="message ai-message">
                <strong>Mentoria AI :</strong>
                <p>Bonjour ! Pose tes questions de cours, je suis là pour t'accompagner.</p>
            </div>
        </div>

        <!-- Barre de saisie -->
        <div class="input-bar">
            <textarea id="userInput" placeholder="Écris ton message ici..." rows="1"></textarea>
            <button id="sendButton" class="send-btn">Envoyer</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
